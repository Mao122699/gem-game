<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17251f">
<title>宝石工坊｜策略桌游</title>
<style>
:root{color-scheme:light;--navy:#082c60;--navy2:#0b3975;--felt:#0c3a78;--gold:#e9bf61;--gold2:#bc842e;--cream:#fff0c2;--ink:#182c4d;--muted:#69758c;--shadow:0 5px 14px #031a3d72}
*{box-sizing:border-box}
html{min-height:100%;background:#082b5e}
body{margin:0;min-height:100vh;min-height:100dvh;color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background-color:var(--felt);background-image:radial-gradient(ellipse at 48% 42%,#15509a 0,#0d3e7c 50%,#082c60 100%),repeating-linear-gradient(117deg,#ffffff08 0 1px,#0000 1px 4px)}
button,input{font:inherit}
button{min-height:38px;border:2px solid #f4d783;border-radius:12px;padding:7px 12px;background:linear-gradient(180deg,#fff1bf,#e3bd63 70%,#c9953b);color:#483414;font-weight:800;cursor:pointer;box-shadow:0 3px 5px #031a3d77,inset 0 1px #fff9dd;touch-action:manipulation;transition:filter .12s,transform .12s}
button:hover:not(:disabled){filter:brightness(1.07);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(1px);box-shadow:0 1px 2px #031a3d77}
button:disabled{opacity:.43;cursor:not-allowed;filter:grayscale(.4)}
button:focus-visible{outline:3px solid #61b7ff;outline-offset:2px}
button.secondary{background:linear-gradient(#f8f5e9,#d7d0bd);border-color:#eee0b1;color:#36425b}
button.gold{background:linear-gradient(#fff0a9,#df9d2a);color:#573500}
header{height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px;color:#fff1c8;background:linear-gradient(180deg,#123e7d,#092e65);border-bottom:2px solid #d9b250;box-shadow:0 3px 10px #031a3d88}
header small{font-size:9px;letter-spacing:2px;opacity:.8}
header h1{margin:0;font-size:22px;white-space:nowrap;text-shadow:0 2px 2px #001b48}
header p{margin:0;color:#d5e5ff;font-size:12px}
main{width:min(1800px,100%);height:calc(100dvh - 83px);min-height:500px;margin:auto;padding:8px 12px 4px;display:grid;grid-template-rows:auto minmax(0,1fr);gap:7px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:7px;flex-wrap:wrap}
.modes{display:flex;gap:7px;flex-wrap:wrap}
.modes button,#reset{min-height:34px;padding:5px 11px;font-size:12px}
.layout{min-height:0;display:grid;grid-template-columns:minmax(180px,18%) minmax(0,1fr) minmax(160px,18%);grid-template-rows:minmax(110px,.82fr) minmax(110px,1fr) minmax(90px,.78fr);gap:8px;align-items:stretch}
.left{display:contents}
.layout>.left>section:first-child{grid-column:1;grid-row:2}
.layout>.left>section:nth-child(2){grid-column:3;grid-row:2/4}
.layout>.left>.score{grid-column:1;grid-row:1}
.layout>.left>.activity{grid-column:1;grid-row:3}
.layout>.market{grid-column:2;grid-row:1/4}
.layout>.bank-panel{grid-column:3;grid-row:1}
.panel{min-width:0;min-height:0;overflow:auto;background:linear-gradient(150deg,#fff4cd,#f4dda5 70%,#ead093);border:3px solid #d9b456;border-radius:17px;padding:10px;box-shadow:var(--shadow),inset 0 0 0 2px #fff9df}
.panel h2{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:0 0 8px;color:#493718;font-size:13px;text-shadow:0 1px #fff9df}
.small{font-size:10px;color:#766743;font-weight:600}
.resources{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px}
.resource{text-align:center;aspect-ratio:1;display:flex;flex-direction:column;justify-content:center;padding:3px;border:2px solid #fff3c5;border-radius:50%;background:radial-gradient(circle at 32% 25%,#fff,#f3d879 70%,#b9872d);box-shadow:0 2px 5px #674b1b55,inset 0 1px #fff}
.resource i{font-style:normal;font-size:19px}.resource b{font-size:15px;color:#493612}.resource small{font-size:8px;color:#715c30;line-height:1.1}
.players{display:grid;grid-template-columns:1fr;gap:6px}
.player{border:1px solid #d8bd75;border-radius:11px;padding:7px;background:#fff9e6;box-shadow:0 2px 4px #604a1b22}
.player.active{outline:2px solid #53a56c;background:#f1ffd9;box-shadow:0 0 0 4px #45a65a33}
.player h3{margin:0 0 4px;font-size:12px}.player p{margin:2px 0;font-size:10px;color:#64583d}
.tier-title{display:flex;align-items:center;gap:7px;margin:7px 0 5px;padding:5px 8px;border:1px solid #d5b85f;border-radius:8px;background:linear-gradient(90deg,#143b73,#0e3268);color:#fff0c5;font-size:11px;font-weight:850;box-shadow:0 2px 4px #041d4488}
.tier-dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 0 2px #fff4ce}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.card{position:relative;min-width:0;min-height:112px;border:2px solid #d4b461;border-radius:11px;padding:7px;background:linear-gradient(150deg,#fff5d7,#e6d3a4);display:flex;flex-direction:column;gap:4px;box-shadow:0 3px 6px #142e5266,inset 0 0 0 1px #fff9e6;overflow:hidden}
.card.tier-card-1{background:linear-gradient(145deg,#fff3ce,#d68c44 165%)}.card.tier-card-2{background:linear-gradient(145deg,#f5f1d9,#a5ad75 165%)}.card.tier-card-3{background:linear-gradient(145deg,#f6e5ff,#9160b0 170%)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:3px}
.card-art{width:32px;height:32px;flex:none;border:1px solid #fff2bf;border-radius:9px;display:grid;place-items:center;background:linear-gradient(145deg,#c87a35,#793e28);font-size:19px;box-shadow:inset 0 0 0 1px #ffdb8a}
.gem-art-diamond{background:linear-gradient(145deg,#eaf8ff,#7aa7c5)}.gem-art-sapphire{background:linear-gradient(145deg,#7bb8ff,#244c91)}.gem-art-emerald{background:linear-gradient(145deg,#79d69e,#21734b)}.gem-art-ruby{background:linear-gradient(145deg,#ff9390,#922b43)}.gem-art-onyx{background:linear-gradient(145deg,#9b9da8,#343544)}
.points{font-size:10px;color:#885a0b;font-weight:900}.card strong{font-size:11px}
.cost{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}.cost span{font-size:9px;padding:2px 4px;border-radius:5px;background:#fff9e9;border:1px solid #e4d4aa;white-space:nowrap}
.card button{min-height:30px;margin-top:2px;padding:4px 6px;font-size:10px}
.nobles{display:flex;flex-direction:column;gap:7px;overflow:auto}
.noble{min-width:0;border:2px solid #c7a85d;border-radius:11px;padding:8px;background:linear-gradient(145deg,#fff9e3,#e5d19b);box-shadow:0 3px 5px #57411633,inset 0 0 0 1px #fff9df}
.noble strong{display:block;font-size:11px}.noble small{display:block;margin-top:4px;color:#615338;font-size:9px}
.status{padding:8px;border:1px solid #d9ca9d;border-radius:10px;background:#fff9e6;color:#284b38;font-size:11px;line-height:1.4;min-height:34px}
.action-row{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.action-row button{padding:6px 8px;font-size:10px}
.log{max-height:110px;overflow:auto;font-size:10px;color:#5d543d;line-height:1.6}
.online{display:grid;gap:7px}.online input{min-width:0;width:100%;border:1px solid #c9b679;border-radius:8px;padding:8px}
.hidden{display:none!important}
.bank-resources{display:grid;grid-template-columns:1fr;gap:5px}
.selected-tray{display:flex;gap:6px;min-height:42px;align-items:center;margin-top:7px}
.selection-slot{height:40px;min-width:35px;flex:1;display:grid;place-items:center;border:2px dashed #c6aa67;border-radius:9px;background:#fff9e7;color:#9a8c67;font-size:22px}
.selection-slot.filled{border-style:solid;border-color:#4087d2;background:#e9f4ff;box-shadow:0 0 0 2px #3186da33}
.bank-token{position:relative;display:flex;align-items:center;justify-content:space-between;gap:5px;width:100%;min-height:48px;border-radius:26px;padding:4px 9px;background:radial-gradient(circle at 30% 20%,#fffef5,#f4dda0 76%,#d8b151);border:2px solid #fff0bd;font-size:13px;font-weight:800;cursor:pointer;touch-action:manipulation;transition:transform .12s,box-shadow .12s,filter .12s}
.bank-token:hover:not(:disabled){filter:brightness(1.07);transform:scale(1.03)}
.bank-token.selected{outline:3px solid #2c86de;outline-offset:1px;box-shadow:0 0 0 5px #3186da55,0 3px 8px #193b5e66;transform:scale(1.03)}
.bank-token:disabled{cursor:not-allowed;opacity:.48}
.bank-token span:first-child{width:32px;height:32px;flex:0 0 32px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#fff,#ddd3b1);box-shadow:inset 0 1px 3px #75633a55;font-size:19px}
.bank-token b{font-size:17px;color:#342919}.bank-token small{font-size:9px;color:#6b5935}.bank-token.gold-bank{background:#ffe49b}
footer{text-align:center;color:#d9e6ff;font-size:10px;padding:1px 12px 8px}
@media(min-width:780px){.layout{grid-template-columns:minmax(180px,17%) minmax(0,1fr) minmax(155px,18%)}.market{min-width:0}.card{min-height:clamp(92px,15vh,145px)}}
@media(max-width:779px) and (orientation:landscape){header{height:39px;padding:3px 10px}header small{display:none}header h1{font-size:17px}header p{display:none}main{height:calc(100dvh - 64px);min-height:0;padding:4px 6px 3px;gap:4px}.bar{gap:4px}.modes{gap:4px}.modes button,#reset{min-height:31px;padding:3px 7px;font-size:10px}.layout{grid-template-columns:minmax(105px,15vw) minmax(0,1fr) minmax(104px,15vw);grid-template-rows:minmax(72px,.8fr) minmax(68px,1fr) minmax(55px,.7fr);gap:4px}.panel{padding:5px;border-width:2px;border-radius:10px}.panel h2{font-size:9px;margin-bottom:4px}.small{font-size:7px}.resources{gap:2px}.resource{border-width:1px}.resource i{font-size:12px}.resource b{font-size:11px}.resource small{font-size:6px}.player{padding:3px}.player h3{font-size:8px}.player p{font-size:6px}.cards{gap:3px}.tier-title{margin:3px 0;padding:2px 4px;font-size:8px}.tier-dot{width:6px;height:6px}.card{min-height:60px;padding:3px;border-width:1px;gap:2px;border-radius:6px}.card-art{width:16px;height:16px;border-radius:4px;font-size:10px}.card strong{font-size:7px}.points{font-size:7px}.cost{gap:1px}.cost span{font-size:6px;padding:1px 2px}.card button{min-height:25px;font-size:7px;padding:2px 1px}.nobles{gap:3px}.noble{padding:4px;min-width:0;border-width:1px;border-radius:6px}.noble strong{font-size:7px}.noble small{font-size:6px;margin-top:2px}.bank-resources{gap:2px}.bank-token{min-height:38px;padding:2px 4px;font-size:9px}.bank-token span:first-child{width:21px;height:21px;flex-basis:21px;font-size:13px}.bank-token b{font-size:11px}.bank-token small{font-size:6px}.selected-tray{min-height:27px;gap:3px;margin-top:3px}.selection-slot{height:25px;min-width:22px;font-size:14px;border-width:1px}.action-row{gap:2px;margin-top:3px}.action-row button{min-height:26px;font-size:7px;padding:2px 4px}.status{font-size:7px;min-height:0;padding:3px}.log{font-size:7px;max-height:36px}}
@media(max-width:779px) and (orientation:portrait){main{height:auto;min-height:calc(100dvh - 83px);padding:7px}.layout{display:flex;flex-direction:column;gap:8px}.left{display:grid;grid-template-columns:1fr 1fr;gap:8px}.layout>.left>section:first-child{order:1}.layout>.left>section:nth-child(2){order:4}.layout>.left>.score{order:0}.layout>.left>.activity{order:5}.layout>.bank-panel{order:2}.layout>.market{order:3}.resources{grid-template-columns:repeat(6,minmax(0,1fr))}.nobles{flex-direction:row}.noble{min-width:130px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.bank-resources{grid-template-columns:repeat(3,minmax(0,1fr))}.bank-token{min-height:49px}}
@media(max-width:430px) and (orientation:portrait){header{height:52px;padding:5px 10px}header h1{font-size:18px}header p{display:none}main{padding:6px}.panel{padding:8px}.resources{grid-template-columns:repeat(3,minmax(0,1fr))}.players{grid-template-columns:repeat(2,minmax(0,1fr))}.modes button,#reset{font-size:10px;padding:4px 7px}.card{min-height:118px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}

/* Reference board layout: players left, ordered market and inventory center, gems and nobles right */
.player-count-control{display:flex;align-items:center;gap:6px;color:#fff0c5;font-size:12px;font-weight:800}
.player-count-control select{min-height:34px;border:2px solid #edcf7d;border-radius:9px;padding:4px 8px;background:linear-gradient(#fff3c9,#e5c36f);color:#463514;font-weight:800}
.layout{grid-template-columns:minmax(155px,17%) minmax(0,1fr) minmax(205px,23%);grid-template-rows:minmax(0,1fr)!important;gap:9px}
.player-rail{grid-column:1;grid-row:1;overflow:auto}
.player-rail .players{gap:9px}
.player-rail .player{padding:10px}
.board-center{grid-column:2;grid-row:1;min-width:0;min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;gap:8px}
.board-center .status{min-height:30px;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.market{grid-column:auto!important;grid-row:auto!important;min-height:0;overflow:auto}
.market #market{display:flex;flex-direction:column;gap:2px}
.market .tier-title{order:initial}
.market .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
.inventory{min-height:105px;overflow:visible}
.inventory-heading{display:flex;justify-content:space-between;align-items:center;gap:8px}
.inventory-heading h2{margin-bottom:3px}
.inventory-total{font-size:12px;font-weight:850;color:#493718;white-space:nowrap}
.inventory-total strong{font-size:19px;color:#073876}
.inventory-legend{display:flex;align-items:center;gap:12px;color:#665732;font-size:9px;margin:1px 0 5px}
.legend-circle,.legend-square{display:inline-block;width:12px;height:12px;vertical-align:-2px;margin-right:3px;background:#fff8dc;border:2px solid #c69e43}
.legend-circle{border-radius:50%}.legend-square{border-radius:2px}
.inventory-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.inventory-item{min-width:0;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:4px 6px;border:1px solid #d3b763;border-radius:10px;background:linear-gradient(#fff8de,#edd79b);box-shadow:inset 0 1px #fff}
.inventory-name{display:flex;align-items:center;gap:4px;min-width:0;font-size:10px;font-weight:800}
.inventory-name i{font-style:normal;font-size:16px}.inventory-name span{overflow:hidden;text-overflow:ellipsis}
.inventory-values{display:flex;align-items:center;gap:4px}
.gem-count-circle,.bonus-count-square{width:29px;height:29px;flex:none;display:grid;place-items:center;color:#29344a;font-size:13px;font-weight:900;border:2px solid #fff2bd;background:radial-gradient(circle at 30% 25%,#fff,#ead081);box-shadow:0 1px 3px #61471955}
.gem-count-circle{border-radius:50%}
.bonus-count-square{border-radius:5px;border-color:#d5aa54;background:linear-gradient(145deg,#fff3c4,#d9ae50)}
.gold-item{border-color:#e0a52e;background:linear-gradient(#fff0ba,#efc653)}
.right-rail{grid-column:3;grid-row:1;min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);gap:8px}
.bank-panel,.noble-panel{min-height:0}
.bank-panel{overflow:visible}
.bank-resources{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.bank-token{min-height:43px;justify-content:flex-start}
.bank-token b{margin-left:auto}
.noble-panel{overflow:auto}
.nobles{display:grid;grid-template-columns:1fr;align-content:start}
.noble{min-height:55px}
@media(min-width:780px){.layout{grid-template-columns:minmax(155px,17%) minmax(0,1fr) minmax(205px,23%)}.market .card{min-height:clamp(76px,12vh,120px)}}
@media(max-width:779px) and (orientation:landscape){
 main{height:calc(100dvh - 64px);min-height:0}
 .layout{grid-template-columns:minmax(115px,18vw) minmax(0,1fr) minmax(140px,22vw)!important;grid-template-rows:minmax(0,1fr)!important;gap:5px}
 .panel{padding:5px}.panel h2{font-size:9px}
 .board-center{gap:4px;grid-template-rows:minmax(0,1fr) auto}
 .board-center .status{min-height:20px;font-size:8px;padding:2px 5px}
 .market .cards{grid-template-columns:repeat(4,minmax(0,1fr))}
 .market .card{min-height:55px}
 .inventory{min-height:72px}.inventory-legend{font-size:7px;gap:5px;margin-bottom:2px}
 .inventory-item{padding:2px 3px;gap:2px}.inventory-name{font-size:7px;gap:2px}.inventory-name i{font-size:11px}
 .gem-count-circle,.bonus-count-square{width:21px;height:21px;font-size:10px}
 .inventory-grid{gap:2px}.right-rail{gap:4px}.bank-resources{grid-template-columns:1fr;gap:2px}
 .bank-token{min-height:34px}.bank-token span:first-child{width:22px;height:22px;flex-basis:22px}
 .noble{min-height:38px;padding:3px}.noble strong{font-size:7px}.noble small{font-size:6px}
 .player-rail .player{padding:4px}.player-rail .player h3{font-size:8px}.player-rail .player p{font-size:7px}
}
@media(max-width:779px) and (orientation:portrait){
 main{height:auto;min-height:calc(100dvh - 83px)}
 .layout{display:flex;flex-direction:column;gap:8px}
 .player-rail{order:1;max-height:220px}
 .board-center{order:2;display:flex;flex-direction:column}
 .right-rail{order:3;display:flex;flex-direction:column}
 .right-rail .noble-panel{order:2}
 .inventory-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
 .bank-resources{grid-template-columns:repeat(3,minmax(0,1fr))}
 .inventory-legend{flex-wrap:wrap}
 .market .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:430px) and (orientation:portrait){
 .inventory-item{padding:4px}.inventory-name{font-size:9px}
 .bank-token{min-height:46px}
 .inventory-heading{align-items:flex-start;flex-wrap:wrap}
}

/* Inventory HUD styled after the supplied reference */
.inventory-hud{position:relative;min-height:106px;display:flex;align-items:center;gap:14px;padding:10px 18px;background:linear-gradient(180deg,#fff3c7 0%,#ffedb4 72%,#f2d991 100%);border:4px solid #e7ba4f;border-radius:44px 44px 20px 20px;box-shadow:0 4px 0 #a87422,inset 0 0 0 3px #fff8d8,inset 0 -5px 9px #c5953b55;overflow:visible}
.inventory-hud::before,.inventory-hud::after{content:"";position:absolute;bottom:-6px;width:23px;height:23px;border:3px solid #e4b34c;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7cf,#d9a63f 75%);box-shadow:inset 0 0 0 3px #fff0b5,0 2px 3px #69481477}
.inventory-hud::before{left:-5px}.inventory-hud::after{right:-5px}
.inventory-count{flex:0 0 clamp(58px,10%,92px);height:68px;display:flex;align-items:center;justify-content:center;gap:2px;border-right:1px solid #dbbf73;color:#fffaf0;text-shadow:1px 2px 2px #34415e,-1px -1px 1px #35415c}
.inventory-count strong{font-size:clamp(22px,3vw,32px);font-weight:900}
.inventory-count span{align-self:center;font-size:clamp(13px,1.8vw,19px);font-weight:850}
.inventory-grid{flex:1;min-width:0;display:grid;grid-template-columns:repeat(6,minmax(25px,1fr));grid-template-rows:36px 36px;align-content:center;gap:2px 10px;padding:0 8px}
.inventory-bonus-row{grid-column:1/6;grid-row:1;display:grid;grid-template-columns:repeat(5,minmax(25px,1fr));gap:10px;justify-items:center}
.inventory-gem-row{grid-column:1/7;grid-row:2;display:grid;grid-template-columns:repeat(6,minmax(25px,1fr));gap:10px;justify-items:center}
.inventory-slot{position:relative;width:min(100%,36px);height:34px;display:grid;place-items:center;color:#3f3b30;border:2px solid #d4ac5d;background:linear-gradient(145deg,#fff3ce,#f3dda0);box-shadow:inset 0 2px 4px #ad843755,0 1px 1px #fff}
.square-slot{border-radius:9px 9px 5px 5px}
.circle-slot{width:min(100%,33px);height:33px;border-radius:50%;margin-top:-1px}
.inventory-slot i{position:absolute;top:1px;font-size:8px;font-style:normal;line-height:1;opacity:.5}

let game, mode='cpu', supabase=null, channel=null, role='host', room='', applyingRemote=false, selectedGems=[], playerCount=2;
function shuffle(a){a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fresh(){selectedGems=[];document.querySelector('#take').textContent='确认领取（0/3）';bank=Object.fromEntries([...NON.map(c=>[c,playerCount===2?4:playerCount===3?5:7]),['gold',5]]);let decks={1:shuffle(CARDS.filter(c=>c.tier===1)),2:shuffle(CARDS.filter(c=>c.tier===2)),3:shuffle(CARDS.filter(c=>c.tier===3))};let market=[];for(let tier=1;tier<=3;tier++)for(let i=0;i<4;i++)market.push(decks[tier].shift());game={players:Array.from({length:playerCount},(_,i)=>player(mode==='cpu'?(i===0?'你':'电脑 '+i):mode==='online'?(i===0?'你':'好友'):'玩家 '+(i+1))),active:0,market,decks,nobles:shuffle(NOBLES).slice(0,playerCount+1),ended:false,log:['新游戏开始。']};render();say(mode==='cpu'?'轮到你行动。先拿宝石或购买发展卡。':mode==='local'?'本地轮流模式：点击按钮执行当前玩家的行动。':'联机房间准备就绪。')}
function player(name){return {name,gems:{diamond:0,sapphire:0,emerald:0,ruby:0,onyx:0,gold:0},bonus:{diamond:0,sapphire:0,emerald:0,ruby:0,onyx:0},points:0}}
function say(s){document.querySelector('#status').textContent=s}function log(s){game.log.unshift(s);game.log=game.log.slice(0,12)}function total(p){return IDS.reduce((n,c)=>n+p.gems[c],0)}function cur(){return game.players[game.active]}
function costLeft(card,p,c){return Math.max(0,(card.cost[c]||0)-p.bonus[c])}function affordable(card,p){return NON.every(c=>costLeft(card,p,c)<=p.gems[c])&&NON.reduce((n,c)=>n+Math.max(0,costLeft(card,p,c)-p.gems[c]),0)<=p.gems.gold}
function render(){renderPlayers();renderResources();renderBank();renderNobles();renderMarket();document.querySelector('#log').innerHTML=game.log.map(x=>'• '+esc(x)).join('<br>');document.querySelector('#take').disabled=game.ended||localBlocked()||selectedGems.length!==3;document.querySelectorAll('[data-mode]').forEach(b=>b.className=b.dataset.mode===mode?'':'secondary')}
function localBlocked(){return mode==='online'&&((role==='host'&&game.active!==0)||(role==='guest'&&game.active!==1))}
function renderPlayers(){document.querySelector('#players').innerHTML=game.players.map((p,i)=>`<div class="player ${game.active===i&&!game.ended?'active':''}"><h3>${esc(p.name)}${game.active===i&&!game.ended?' · 行动中':''}</h3><p>🏆 ${p.points} 分　🃏 ${p.bonus.diamond+p.bonus.ruby+p.bonus.sapphire+p.bonus.emerald+p.bonus.onyx} 张发展卡</p><p>⚪${p.gems.diamond} 🔵${p.gems.sapphire} 🟢${p.gems.emerald} 🔴${p.gems.ruby} ⚫${p.gems.onyx} 🟡${p.gems.gold}</p></div>`).join('')}
function selectGem(color){if(game.ended||localBlocked()||!NON.includes(color)||bank[color]<1)return;if(selectedGems.includes(color))selectedGems=selectedGems.filter(c=>c!==color);else if(selectedGems.length<3)selectedGems.push(color);else{say('已选满三种，点已选颜色可取消后重选。');return}renderBank();}function renderBank(){document.querySelector('#bankResources').innerHTML=C.map(([id,n,ic])=>`<button type="button" class="bank-token ${id==='gold'?'gold-bank':''} ${selectedGems.includes(id)?'selected':''}" data-bank-gem="${id}" aria-pressed="${selectedGems.includes(id)}" ${id==='gold'||bank[id]<1||localBlocked()?'disabled':''} onclick="selectGem('${id}')" title="点选${n}"><span>${ic}</span><b>${bank[id]}</b><small>${n}</small></button>`).join('');document.querySelector('#selectedTray').innerHTML=Array.from({length:3},(_,i)=>`<div class="selection-slot ${selectedGems[i]?'filled':''}">${selectedGems[i]?ICON[selectedGems[i]]:'＋'}</div>`).join('');document.querySelector('#take').textContent=`确认领取（${selectedGems.length}/3）`;document.querySelector('#take').disabled=game.ended||localBlocked()||selectedGems.length!==3}function renderResources(){let p=cur();document.querySelector('#gemTotal').textContent=total(p);let bonus=NON.map(c=>'<div class="inventory-slot square-slot gem-'+c+'" title="'+NAME[c]+'永久加成：'+p.bonus[c]+'" aria-label="'+NAME[c]+'永久加成 '+p.bonus[c]+'"><i>'+ICON[c]+'</i><b>'+(p.bonus[c]||'')+'</b></div>').join('');let gems=NON.map(c=>'<div class="inventory-slot circle-slot gem-'+c+'" title="拿取'+NAME[c]+'：'+p.gems[c]+'" aria-label="拿取'+NAME[c]+' '+p.gems[c]+'"><i>'+ICON[c]+'</i><b>'+(p.gems[c]||'')+'</b></div>').join('')+'<div class="inventory-slot circle-slot gem-gold" title="拿取金币：'+p.gems.gold+'" aria-label="拿取金币 '+p.gems.gold+'"><i>'+ICON.gold+'</i><b>'+(p.gems.gold||'')+'</b></div>';document.querySelector('#resources').innerHTML='<div class="inventory-bonus-row">'+bonus+'</div><div class="inventory-gem-row">'+gems+'</div>'}
function renderNobles(){document.querySelector('#nobleRule').textContent=game.nobles.length+' 位贵族';document.querySelector('#nobles').innerHTML=game.nobles.map(n=>`<div class="noble"><strong>👑 ${n.name}</strong><small>需要 ${Object.entries(n.need).map(([c,v])=>ICON[c]+v).join(' ')}</small></div>`).join('')||'<span class="small">贵族已全部到访。</span>'}
function renderMarket(){let root=document.querySelector('#market');root.innerHTML='';for(let t=3;t>=1;t--){let cards=game.market.filter(c=>c.tier===t);let h=document.createElement('div');h.className='tier-title';h.innerHTML=`<span class="tier-dot" style="background:${['#79a889','#7c9bc6','#c5a254'][t-1]}"></span>${['初级发展卡','中级发展卡','高级发展卡'][t-1]} <span class="small">· ${cards.length} 张</span>`;root.append(h);let w=document.createElement('div');w.className='cards';for(let card of cards){let el=document.createElement('article');el.className='card tier-card-'+card.tier;el.innerHTML=`<div class="card-top"><div class="card-art gem-art-${card.color}">${ICON[card.color]}</div><span class="points">${card.points?'★ '+card.points+' 分':'发展卡'}</span></div><strong>${NAME[card.color]}加成</strong><div class="cost">${Object.entries(card.cost).filter(([,v])=>v>0).map(([c,v])=>`<span>${ICON[c]} ${v}</span>`).join('')}</div><button data-buy="${card.id}" ${game.ended||localBlocked()||!affordable(card,cur())?'disabled':''}>购买</button>`;w.append(el)}root.append(w)}root.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>act('buy',Number(b.dataset.buy)))}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function act(type,arg,remote=false){if(game.ended||(!remote&&localBlocked()))return;if(mode==='online'&&role==='guest'&&!remote){channel?.send({type:'broadcast',event:'action',payload:{action:type,id:arg,color:arg}});if(type==='takeSelected'){selectedGems=[];renderBank()}say('已发送行动请求，等待房主确认。');return}const p=cur();if(type==='take'){let available=shuffle(NON.filter(c=>gemBank(c)>0));let colors=available.slice(0,3);if(colors.length<3){say('可领取的不同颜色宝石不足 3 种。');return}colors.forEach(c=>{p.gems[c]++;bank[c]--});finishTurn('拿取了三种不同颜色宝石。')}
else if(type==='takeSelected'){let colors=Array.isArray(arg)?arg:[];if(colors.length!==3||new Set(colors).size!==3||colors.some(c=>!NON.includes(c)||bank[c]<1)){say('请选择三种供应充足的不同颜色宝石。');return}colors.forEach(c=>{p.gems[c]++;bank[c]--});selectedGems=[];finishTurn('拿取了'+colors.map(c=>NAME[c]).join('、')+'。')}
else if(type==='pair'){let c=arg;if(gemBank(c)<4){say('该颜色供应不足 4 枚，不能拿两枚。');return}p.gems[c]+=2;bank[c]-=2;finishTurn('拿取了两枚'+NAME[c]+'。')}
else if(type==='buy'){let card=game.market.find(x=>x.id===arg);if(!card||!affordable(card,p))return;let gold=0;for(let c of NON){let due=costLeft(card,p,c),paid=Math.min(due,p.gems[c]);p.gems[c]-=paid;bank[c]+=paid;gold+=due-paid}p.gems.gold-=gold;bank.gold+=gold;p.bonus[card.color]++;p.points+=card.points;game.market=game.market.filter(x=>x.id!==arg);if(game.decks[card.tier].length)game.market.push(game.decks[card.tier].shift());finishTurn('购买了'+NAME[card.color]+'发展卡'+(card.points?'，获得 '+card.points+' 分':''))}
else if(type==='return'){if(p.gems[arg]<1)return;p.gems[arg]--;bank[arg]++;if(total(p)<=10)finishTurn('归还了一枚宝石。');else render()}}
let bank={diamond:4,sapphire:4,emerald:4,ruby:4,onyx:4,gold:5};function gemBank(c){return bank[c]}
function finishTurn(note){if(total(cur())>10){game.pendingNote=note;render();say('宝石超过 10 枚，请点击宝石歸還，直到剩余 10 枚。');return}let p=cur();selectedGems=[];document.querySelector('#take').textContent='点选宝石（0/3）';log(p.name+note);let visited=[];game.nobles=game.nobles.filter(n=>{if(NON.every(c=>p.bonus[c]>=n.need[c]||!n.need[c])){p.points+=3;visited.push(n.name);return false}return true});if(visited.length)log('贵族来访：'+visited.join('、')+'（+3 分）');if(p.points>=15){game.ended=true;log(p.name+'达到 15 分！')}game.active=(game.active+1)%game.players.length;render();say(game.ended?p.name+'赢得本局！点击重新开始再玩一局。':`行动完成。现在轮到${cur().name}。`);publish();if(mode==='cpu'&&game.active>0&&!game.ended)setTimeout(cpuTurn,550)}
function returnUI(){if(total(cur())<=10)return '';return IDS.filter(c=>cur().gems[c]>0).map(c=>`<button class="secondary" data-return="${c}">归还 ${ICON[c]}</button>`).join('')}
function render(){renderPlayers();renderResources();renderBank();renderNobles();renderMarket();document.querySelector('#log').innerHTML=game.log.map(x=>'• '+esc(x)).join('<br>');document.querySelector('#take').disabled=game.ended||localBlocked();document.querySelectorAll('[data-mode]').forEach(b=>b.className=b.dataset.mode===mode?'':'secondary');let extras=returnUI();document.querySelector('#take').parentElement.querySelectorAll('[data-return]').forEach(x=>x.remove());if(extras)document.querySelector('#take').insertAdjacentHTML('afterend',extras);document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>act('return',b.dataset.return));}
function cpuTurn(){if(game.ended||mode!=='cpu'||game.active===0)return;let p=cur(),cards=game.market.filter(c=>affordable(c,p)).sort((a,b)=>b.points-a.points);if(cards.length){act('buy',cards[0].id);return}let target=game.market.map(c=>({c,need:NON.filter(k=>costLeft(c,p,k)>p.gems[k]).sort((a,b)=>costLeft(c,p,b)-p.gems[b])})).sort((a,b)=>a.need.length-b.need.length)[0];let picks=target?target.need.slice(0,3):[];picks=picks.filter(c=>gemBank(c)>0);if(picks.length<3)picks=[...picks,...shuffle(NON.filter(c=>gemBank(c)>0&&!picks.includes(c)))].slice(0,3);if(picks.length){picks.forEach(c=>{p.gems[c]++;bank[c]--});finishTurn('拿取了宝石。')}else{say('电脑没有合法行动；点击重新开始。')}}
document.querySelector('#take').onclick=()=>{if(selectedGems.length===3)act('takeSelected',[...selectedGems]);else say('请先点选三种不同颜色的宝石。')};document.querySelector('#take').insertAdjacentHTML('afterend',`<div id="pairs" class="action-row"></div>`);document.querySelector('#pairs').innerHTML=NON.map(c=>`<button class="secondary" data-pair="${c}">拿 2 ${ICON[c]}</button>`).join('');document.querySelectorAll('[data-pair]').forEach(b=>b.onclick=()=>act('pair',b.dataset.pair));const playerCountSelect=document.querySelector('#playerCount');playerCountSelect.onchange=()=>{playerCount=Number(playerCountSelect.value);fresh()};document.querySelector('#reset').onclick=()=>fresh();document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelector('#onlinePanel').classList.toggle('hidden',mode!=='online');if(mode==='online'){playerCount=2;playerCountSelect.value='2'}playerCountSelect.disabled=mode==='online';disconnect();fresh()});
function config(){return {url:document.querySelector('#supUrl').value.trim(),key:document.querySelector('#supKey').value.trim()}}function saveConfig(){let x=config();localStorage.setItem('gemSupabase',JSON.stringify(x));status('连接设置已保存在此浏览器。')}function status(s){document.querySelector('#onlineStatus').textContent=s}
document.querySelector('#saveConfig').onclick=saveConfig;try{let x=JSON.parse(localStorage.getItem('gemSupabase')||'{}');document.querySelector('#supUrl').value=x.url||'';document.querySelector('#supKey').value=x.key||''}catch{}
async function connect(code,host){let cfg=config();if(!cfg.url||!cfg.key){status('请先填写 Supabase URL 和 anon/public key。');return}if(!window.supabase){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';s.onload=resolve;s.onerror=reject;document.head.append(s)});}supabase=window.supabase.createClient(cfg.url,cfg.key);room=code;role=host?'host':'guest';if(host){mode='online';fresh();}channel=supabase.channel('gem-room-'+room,{config:{broadcast:{self:false}}});channel.on('broadcast',{event:'state'},({payload})=>{if(role==='guest'&&payload.state){applyingRemote=true;game=payload.state;bank=payload.bank;render();say('已同步房间状态。');applyingRemote=false}}).on('broadcast',{event:'action'},({payload})=>{if(role==='host'&&payload.action){if(payload.action==='take')act('take',null,true);else if(payload.action==='takeSelected')act('takeSelected',payload.color,true);else if(payload.action==='buy')act('buy',payload.id,true);else if(payload.action==='pair')act('pair',payload.color,true);else if(payload.action==='return')act('return',payload.color,true)}}).on('broadcast',{event:'hello'},()=>{if(role==='host')publish()}).subscribe(async st=>{if(st==='SUBSCRIBED'){if(host)publish();else{channel.send({type:'broadcast',event:'hello',payload:{}});status('已加入房间 '+room+'。等待房主同步。')}}});status((host?'房间已创建：':'正在加入：')+room+'。把房间码分享给朋友。')}
function publish(){if(channel&&!applyingRemote&&role==='host')channel.send({type:'broadcast',event:'state',payload:{state:game,bank}})}function disconnect(){if(channel&&supabase)supabase.removeChannel(channel);channel=null;supabase=null}
document.querySelector('#createRoom').onclick=()=>{let code=(document.querySelector('#roomCode').value||Math.random().toString(36).slice(2,8)).toUpperCase();document.querySelector('#roomCode').value=code;saveConfig();connect(code,true)};document.querySelector('#joinRoom').onclick=()=>{let code=document.querySelector('#roomCode').value.trim().toUpperCase();if(!code){status('输入朋友分享的房间码。');return}saveConfig();connect(code,false)};
fresh();
</script></body></html>
